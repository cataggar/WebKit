name: jsc full build

on:
  workflow_dispatch:
  push:
    branches:
      - buz-build-zig
  pull_request:
    types: [opened, reopened, synchronize, labeled]

# A full JSC compile is expensive, so on PRs it only runs when the PR carries
# the "full-build" label. It always runs on manual dispatch and on pushes to
# the integration branch.
jobs:
  jsc-linux:
    name: full JSC build (linux-x64, release)
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'full-build')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      # ghr uses GitHub auth for downloads (avoids anonymous rate limits).
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Zig version
        id: zig
        shell: bash
        run: echo "version=$(cat .zig-version)" >> "$GITHUB_OUTPUT"
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig.outputs.version }}

      # Bootstrap the ghr release tool (PyPI wrapper that ships the ghr binary).
      - name: Install ghr
        run: |
          pipx install ghr-bin
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Install the LLVM toolchain that matches Bun/Zig's bundled LLVM, so the
      # JSC objects are ABI/bitcode-compatible. Uses ghr instead of apt/brew.
      - name: Install LLVM via ghr
        run: |
          LLVM_DIR="$RUNNER_TEMP/llvm"
          ghr download cataggar/llvm-project@llvm-zig-22.1.8 --extract "$LLVM_DIR"
          LLVM_BIN="$(dirname "$(find "$LLVM_DIR" -type f -name clang-22 | head -1)")"
          echo "Using LLVM bin: $LLVM_BIN"
          echo "$LLVM_BIN" >> "$GITHUB_PATH"

      # System ICU + codegen tools (the LLVM toolchain comes from ghr above).
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ruby ruby-dev bison gawk perl make python3 libicu-dev ccache
          clang-22 --version
          cmake --version
          ninja --version

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-jsc-linux-${{ github.sha }}
          restore-keys: |
            ccache-jsc-linux-

      - name: Build JSC (release) via build.zig
        run: zig build -Dconfig=release

      - name: Smoke-test the jsc binary
        run: |
          ls -la WebKitBuild/Release/bin || true
          JSC=WebKitBuild/Release/bin/jsc
          test -x "$JSC"
          out="$("$JSC" -e 'print(40 + 2)')"
          echo "jsc output: $out"
          test "$out" = "42"
